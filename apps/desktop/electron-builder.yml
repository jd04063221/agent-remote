appId: io.github.jd04063221.agent-remote
productName: Agent Remote
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
