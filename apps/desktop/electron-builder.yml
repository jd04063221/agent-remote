appId: io.github.jd04063221.agent-remote
productName: Agent Remote
executableName: agent-remote
asar: false
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: cli-bin
    to: bin
mac:
  category: public.app-category.developer-tools
  artifactName: "agent-remote-${version}-macos-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
linux:
  category: Development
  maintainer: "agent-remote <noreply@users.noreply.github.com>"
  artifactName: "agent-remote-${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
deb:
  packageName: agent-remote-desktop
  afterInstall: packaging/deb-after-install.sh
  afterRemove: packaging/deb-after-remove.sh
nsis:
  artifactName: "agent-remote-${version}-windows-${arch}-setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: packaging/installer.nsh
portable:
  artifactName: "agent-remote-${version}-windows-${arch}-portable.${ext}"
