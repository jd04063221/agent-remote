name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-remote-node:
    name: Go Remote Node Test & Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/remote-node/go.sum
      - name: Run Go unit & concurrency tests
        working-directory: apps/remote-node
        run: go test -race -v ./...
      - name: Cross-compile all 6 platforms
        run: make go-build-all

  ts-monorepo:
    name: TypeScript Monorepo Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Go remote-node for integration tests
        run: make go-build
      - name: Build & Typecheck TypeScript packages
        run: pnpm run build
      - name: Run Vitest suite
        run: pnpm run test
