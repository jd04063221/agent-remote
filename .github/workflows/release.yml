name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-remote-node:
    name: Build Go remote-node (6 platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/remote-node/go.sum
      - name: Build all remote-node binaries
        run: make go-build-all
      - name: Generate SHA256 checksums
        working-directory: apps/remote-node/bin
        run: sha256sum agent-remote-node-* > checksums-remote-node.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-node-binaries
          path: |
            apps/remote-node/bin/agent-remote-node-*
            apps/remote-node/bin/checksums-remote-node.txt

  build-cli-bundle:
    name: Build CLI + Web Workbench Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Stage portable CLI + Web bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-bundle
          pnpm --filter agent-remote deploy --legacy --prod release-bundle/agent-remote
          node -e '
            const fs = require("node:fs");
            const p = "release-bundle/agent-remote/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            const ver = (process.env.RELEASE_TAG || "").replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(ver)) pkg.version = ver;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          mkdir -p release-bundle/agent-remote/web
          cp -r apps/web/dist release-bundle/agent-remote/web/dist
          tar -czf agent-remote-cli-web.tar.gz -C release-bundle agent-remote
          sha256sum agent-remote-cli-web.tar.gz > checksums-cli-web.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cli-web-bundle
          path: |
            agent-remote-cli-web.tar.gz
            checksums-cli-web.txt

  build-desktop:
    name: Build Electron Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            eb_flag: --mac
            artifact_glob: |
              desktop-stage/desktop/release/*.dmg
              desktop-stage/desktop/release/*.zip
          - os: windows-latest
            eb_flag: --win
            artifact_glob: |
              desktop-stage/desktop/release/*.exe
          - os: ubuntu-latest
            eb_flag: --linux
            artifact_glob: |
              desktop-stage/desktop/release/*.AppImage
              desktop-stage/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies & build monorepo
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Stage self-contained desktop app
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p desktop-stage/web desktop-stage/builder
          pnpm --filter @agent-remote/desktop deploy --legacy --prod desktop-stage/desktop
          node -e '
            const fs = require("node:fs");
            const p = "desktop-stage/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.name = "agent-remote-desktop";
            pkg.desktopName = "agent-remote.desktop";
            const ver = (process.env.RELEASE_TAG || "").replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(ver)) pkg.version = ver;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          cp -r apps/web/dist desktop-stage/web/dist
          cp -r apps/desktop/cli-bin desktop-stage/desktop/cli-bin
          cp -r apps/desktop/packaging desktop-stage/desktop/packaging
          chmod +x desktop-stage/desktop/cli-bin/ar desktop-stage/desktop/cli-bin/agent-remote desktop-stage/desktop/packaging/*.sh
          cp apps/desktop/electron-builder.yml desktop-stage/desktop/electron-builder.yml
      - name: Install Electron & electron-builder and package installer
        shell: bash
        run: |
          cd desktop-stage/builder
          npm init -y
          npm install --no-audit --no-fund electron@latest electron-builder@latest
          ELECTRON_VER=$(node -p "require('./node_modules/electron/package.json').version")
          cd ../desktop
          ../builder/node_modules/.bin/electron-builder --config electron-builder.yml ${{ matrix.eb_flag }} --publish never -c.electronVersion="$ELECTRON_VER"
      - name: Smoke test bundled ar / agent-remote CLI
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            OUT="$(cmd.exe //c 'desktop-stage\desktop\release\win-unpacked\resources\bin\ar.cmd --version' | tr -d '\r')"
            echo "Windows ar.cmd: $OUT"
            echo "$OUT" | grep -q "agent-remote (ar)"
            HELP_OUT="$(cmd.exe //c 'desktop-stage\desktop\release\win-unpacked\resources\bin\agent-remote.cmd help' | tr -d '\r')"
            echo "$HELP_OUT" | head -n 5
            echo "$HELP_OUT" | grep -q "ar doctor"
            BASH_OUT="$("desktop-stage/desktop/release/win-unpacked/resources/bin/ar" --version | tr -d '\r')"
            echo "Windows Git Bash ar: $BASH_OUT"
            echo "$BASH_OUT" | grep -q "agent-remote (ar)"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            OUT="$("desktop-stage/desktop/release/mac-arm64/Agent Remote.app/Contents/Resources/bin/ar" --version)"
            echo "macOS ar: $OUT"
            echo "$OUT" | grep -q "agent-remote (ar)"
            "desktop-stage/desktop/release/mac-arm64/Agent Remote.app/Contents/Resources/bin/agent-remote" help | head -n 5
          else
            OUT="$("desktop-stage/desktop/release/linux-unpacked/resources/bin/ar" --version)"
            echo "Linux ar: $OUT"
            echo "$OUT" | grep -q "agent-remote (ar)"
            "desktop-stage/desktop/release/linux-unpacked/resources/bin/agent-remote" help | head -n 5
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-remote-node, build-cli-bundle, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "agent-remote ${{ steps.tag.outputs.name }}"
          generate_release_notes: true
          files: dist-all/*
